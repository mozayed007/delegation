# Roster schema (informational)

```yaml
schema_version: 1
generated_at: <ISO-8601>
ccr:
  host: 127.0.0.1
  port: 3456
  reachable: true|false|unknown
roles:
  T0:
    job: string
    harnesses: [string]
  T1:
    job: string
    harnesses: [string]
  T2:
    job: string
    harnesses: [string]
quota_fallback:
  when: string
  dedicated: [string]
  stay_on: [string]
  same_model:
    <family>:
      cursor: string
      devin: string
  do_not: [string]
pricing_gate:
  max_api_output_usd_per_m: number
never_pin: [string]
tools:
  <name>:
    present: true|false
    binary: string|null
    version: string|null
    config_home: string|null
    default_model: string|null
    role_if_used_as_is: T0|T1|T2|unknown|null
    notes: string|null
    env_var_names: [string]
coverage:
  - source: string
    result: found|missing|skipped
    detail: string
```

Rules:

- Never store API keys, tokens, or file contents of credential files.
- `env_var_names` lists names only.
- A missing harness is a coverage row with `result: missing`, not a guess.
- `cursor-agent --list-models` returning empty is not evidence that Cursor has no models.
- Cursor default Composer and Devin default `swe` are `role_if_used_as_is` only. T0/T1 capability is the picker, recorded in `quota_fallback.same_model`.
- `never_pin` lists API SKUs at or above $30/MTok output (Fable, Mythos, fast/priority, Cyber). Subscription Sol is not in that list.
